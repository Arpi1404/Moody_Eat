name: CI

# The checks every change is expected to pass: the backend test suite, and the
# frontend lint, tests + production build (which also generates the guide pages).
# Needs no secrets: the backend suite is offline and uses fake providers.
# Deploys nothing: Vercel builds the frontend itself, the backend is deployed by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push on the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
