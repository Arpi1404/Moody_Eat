<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- A creator's manage link carries the key to their page after the "#".
         This runs while the page is still being read, before analytics or the
         app: it moves the key into storage and takes it off the address bar,
         so no other script ever sees it there. Mirrors
         captureKeyFromAddress in src/lib/creatorKey.ts: change one, change
         both. -->
    <script>
      ;(function () {
        if (location.pathname.replace(/\/+$/, '') !== '/manage') return
        var match = /^#k=([^&]+)/.exec(location.hash)
        if (!match) return
        try {
          localStorage.setItem('moodyeat:creator_key_new', match[1])
        } catch (e) {
          window.__moodyeatNewKey = match[1]
        }
        history.replaceState(history.state, '', location.pathname)
      })()
    </script>
    <!-- Umami, cookie-free analytics. Runs only on the production hosts, and
         keeps query strings and #fragments out of recorded URLs: share links
         and search pages carry quest titles and typed areas there. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="4f8f2eac-9e9d-44e9-a11a-e68ad70bdf6f"
      data-domains="moodyeat.in,www.moodyeat.in"
      data-exclude-search="true"
      data-exclude-hash="true"
    ></script>
    <title>MoodyEat — Tell us the mood. We'll handle the plans.</title>
    <meta
      name="description"
      content="Pick your vibe and MoodyEat builds a quest around it — a few good places in the right order, mapped and timed. Morning, afternoon or night."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MoodyEat" />
    <meta property="og:title" content="MoodyEat — Tell us the mood. We'll handle the plans." />
    <meta
      property="og:description"
      content="Tell us the occasion — date, friends, solo or family — and get a quest: a few good places, mapped, timed and ready to go."
    />
    <meta property="og:url" content="https://www.moodyeat.in/" />
    <meta property="og:image" content="https://www.moodyeat.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MoodyEat — Tell us the mood. We'll handle the plans." />
    <meta
      name="twitter:description"
      content="A few good places in the right order — mapped, timed and ready to go."
    />
    <meta name="twitter:image" content="https://www.moodyeat.in/og-image.png" />
    <meta name="theme-color" content="#c7522a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
